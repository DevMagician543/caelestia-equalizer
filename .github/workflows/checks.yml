name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m compileall -q install.py assets/sound tests
      - name: Check Bash syntax
        run: bash -n install.sh
      - name: Test installer and configuration preservation
        run: python -m unittest discover -s tests -v
